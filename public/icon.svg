<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle inner radial glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.08" />

  <!-- Main AI Neural Star / Sparkle icon in safe zone -->
  <path d="M 256 100 C 256 186 256 186 342 256 C 256 326 256 326 256 412 C 256 326 256 326 170 256 C 256 186 256 186 256 100 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  
  <!-- Secondary accent sparkle -->
  <path d="M 360 120 C 360 145 360 145 385 165 C 360 185 360 185 360 210 C 360 185 360 185 335 165 C 360 145 360 145 360 120 Z" fill="#ffffff" opacity="0.9" />

  <!-- Tertiary small sparkle -->
  <circle cx="150" cy="360" r="12" fill="#ffffff" opacity="0.75" />
</svg>
